networks:
  proxy:
    external: true

services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    restart: unless-stopped
    volumes:
      - /mnt/data/actual/data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - default
      - proxy
